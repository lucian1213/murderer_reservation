<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이엠 어 머더러 · 예약 현황</title>
<meta name="robots" content="noindex, nofollow">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#0a0807; --panel:#181310; --panel-2:#211a16;
  --line:#31261f; --line-soft:#241c17;
  --bone:#e8e0d4; --dust:#9d9083; --dust-dim:#6e6459;
  --lamp:#f0d29a; --ember:#c2622b; --ember-hi:#e07b3c; --marker:#e3b23c;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Malgun Gothic',sans-serif;
  --tag:'Bebas Neue','Pretendard Variable',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--ink); color:var(--bone); font-family:var(--sans);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh;}
body::before{content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(700px 400px at 10% -10%, rgba(240,210,154,.06), transparent 70%),
             linear-gradient(180deg,#0d0a08,#070505);}
.wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 18px 80px;}

.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:22px;}
.top h1{font-family:var(--serif); font-size:21px; font-weight:700; margin:0;}
.top .sub{font-family:var(--tag); font-size:13px; letter-spacing:.3em; color:var(--ember); margin:0 0 4px;}
.top .right{display:flex; gap:8px;}
.top .stamp{font-size:12px; color:var(--dust-dim); align-self:center; margin-right:6px;}

.btn{font-family:var(--sans); font-size:13.5px; font-weight:600; padding:10px 18px;
  border:1px solid var(--ember); background:var(--ember); color:#160c06; cursor:pointer; border-radius:0;}
.btn:hover{background:var(--ember-hi);}
.btn.ghost{background:transparent; color:var(--dust); border-color:var(--line);}
.btn.ghost:hover{color:var(--bone); border-color:var(--dust-dim);}
.btn:disabled{opacity:.4; cursor:not-allowed;}
:focus-visible{outline:2px solid var(--marker); outline-offset:2px;}

input{padding:10px 12px; background:rgba(0,0,0,.35); border:1px solid var(--line);
  color:var(--bone); font-family:var(--sans); font-size:14px; border-radius:0; width:100%;}
input:focus{outline:none; border-color:var(--ember);}
label.lab{display:block; font-family:var(--tag); font-size:12px; letter-spacing:.2em; color:var(--dust); margin-bottom:6px;}
.field{margin-bottom:12px;}
.msg{font-size:13px; min-height:19px; margin-top:12px;}
.msg.err{color:#e0785c;}
.spin{display:inline-block; width:12px; height:12px; border:2px solid rgba(232,224,212,.25);
  border-top-color:var(--ember); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px;}
@keyframes sp{to{transform:rotate(360deg);}}

#gate{position:relative; z-index:1; max-width:400px; margin:14vh auto; border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel)); padding:28px;}
#gate h2{font-family:var(--serif); margin:0 0 6px; font-size:19px;}
#gate p.sub{color:var(--dust); font-size:13px; margin:0 0 20px;}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:1px;
  background:var(--line-soft); border:1px solid var(--line-soft); margin-bottom:22px;}
.stat{background:var(--panel); padding:14px 16px;}
.stat dt{font-family:var(--tag); font-size:11.5px; letter-spacing:.2em; color:var(--dust-dim); margin-bottom:3px;}
.stat dd{margin:0; font-family:var(--tag); font-size:25px; line-height:1.1;}
.stat dd small{font-family:var(--sans); font-size:12px; color:var(--dust); margin-left:4px;}

.months{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.month-tab{font-family:var(--tag); font-size:15px; letter-spacing:.14em; padding:8px 15px;
  background:transparent; color:var(--dust-dim); border:1px solid var(--line-soft); cursor:pointer;}
.month-tab.on{background:var(--bone); color:var(--ink); border-color:var(--bone);}

.days{display:flex; flex-direction:column; gap:10px;}
.daycard{border:1px solid var(--line-soft); background:rgba(0,0,0,.22);}
.daycard.off{opacity:.55;}
.dayhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 14px; border-bottom:1px solid var(--line-soft); background:rgba(255,255,255,.015);}
.dayhead h3{margin:0; font-family:var(--serif); font-size:15.5px; font-weight:700;}
.dayhead h3 em{font-style:normal; color:var(--dust); font-size:12.5px; margin-left:6px;}
.dayhead .cnt{font-family:var(--tag); font-size:13.5px; letter-spacing:.1em; color:var(--marker); margin-left:auto;}
.today{font-family:var(--tag); font-size:10.5px; letter-spacing:.14em; color:var(--ink); background:var(--lamp); padding:2px 7px;}

.cells{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line-soft);}
.cell{background:var(--panel); padding:11px 13px; min-height:70px;}
.cell .time{font-family:var(--tag); font-size:17px; letter-spacing:.05em;}
.cell .who{font-size:13.5px; margin-top:2px; word-break:break-all;}
.cell .who b{font-weight:600;}
.cell .code{font-family:var(--tag); font-size:12px; letter-spacing:.08em; color:var(--dust);}
.cell .note{font-size:12px; color:var(--dust-dim); margin-top:2px;}
.cell.taken{background:linear-gradient(180deg,rgba(194,98,43,.13),var(--panel));}
.cell.blocked{background:repeating-linear-gradient(135deg,var(--panel),var(--panel) 9px,rgba(157,48,32,.09) 9px,rgba(157,48,32,.09) 18px);}
.pill{display:inline-block; font-size:10.5px; padding:1px 7px; border:1px solid var(--line); color:var(--dust); margin-top:4px;}
.pill.ok{color:#8fc79a; border-color:#2b4331;}
.pill.wait{color:var(--marker); border-color:#4a3c18;}
.empty-state{color:var(--dust-dim); padding:40px 0; text-align:center;}

@media (max-width:760px){ .cells{grid-template-columns:1fr;} .wrap{padding:18px 12px 60px;} }
</style>
</head>
<body>
<noscript><div style="background:#7d2517;color:#fff;padding:14px 18px;text-align:center;font-family:sans-serif;font-size:14px">
이 페이지는 자바스크립트가 켜져 있어야 합니다.</div></noscript>
<div id="netBar" hidden style="background:#7d2517;color:#ffe9e2;padding:12px 18px;text-align:center;font-size:13.5px;position:relative;z-index:99">
  예약 서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 페이지를 새로고침해 주세요.
</div>

<!-- 로그인 -->
<div id="gate">
  <h2>예약 현황</h2>
  <p class="sub">I'M (NOT) A MURDERER · 조회 전용</p>
  <div class="field">
    <label class="lab" for="email">이메일</label>
    <input type="text" id="email" autocomplete="username" spellcheck="false">
  </div>
  <div class="field">
    <label class="lab" for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
  </div>
  <button class="btn" id="pwBtn" style="width:100%">열기</button>
  <p class="msg" id="pwMsg"></p>
</div>

<!-- 본문 -->
<div class="wrap" id="app" hidden>
  <div class="top">
    <div>
      <p class="sub">STATUS</p>
      <h1>아이엠 어 머더러 예약 현황</h1>
    </div>
    <div class="right">
      <span class="stamp" id="stamp"></span>
      <button class="btn ghost" id="reloadBtn">새로고침</button>
      <button class="btn ghost" id="outBtn">로그아웃</button>
    </div>
  </div>

  <dl class="stats" id="stats"></dl>
  <div class="months" id="months"></div>
  <div class="days" id="days"></div>
</div>

<script>
/* ══════ 설정 — 예약·관리자 페이지와 같은 값이어야 합니다 ══════ */
const CONFIG = {
  firebase: {
    apiKey: "AIzaSyDEwIv6IFu0_Tg4OaYiUK5GWwpHqia6tlE",
    authDomain: "reservation-mind.firebaseapp.com",
    projectId: "reservation-mind",
    storageBucket: "reservation-mind.firebasestorage.app",
    messagingSenderId: "137392518118",
    appId: "1:137392518118:web:a33e8eaf4399b46e2b9c27"
  },
  seasonStart: '2026-08-14',
  seasonEnd:   '2026-11-15',
  openDays:    [5, 6, 0],
  extraDates:  ['2026-08-17', '2026-09-24', '2026-10-05'],
  closed: ['2026-09-05', '2026-09-19', '2026-09-04_10:00', '2026-10-17_14:00'],
  times: ['10:00', '14:00', '18:00'],
  col: { reservations:'aim_reservations', blocks:'aim_blocks' }
};

let db = null, auth = null, netOk = true;
try {
  firebase.initializeApp(CONFIG.firebase);
  db = firebase.firestore();
  auth = firebase.auth();
} catch (e) { netOk = false; console.error(e); }

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const slotId = (d,t) => `${d}_${t}`;
const dowKr = k => '일월화수목금토'[parseKey(k).getDay()];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = { dates:[], monthKeys:[], month:null, res:{}, blocks:{} };

function buildDates(){
  const keys=new Set(CONFIG.extraDates||[]); const end=parseKey(CONFIG.seasonEnd);
  for(let d=parseKey(CONFIG.seasonStart); d<=end; d.setDate(d.getDate()+1))
    if(CONFIG.openDays.includes(d.getDay())) keys.add(keyOf(d));
  state.dates=[...keys].sort();
  state.monthKeys=[...new Set(state.dates.map(k=>k.slice(0,7)))];
  const nowM=keyOf(new Date()).slice(0,7);
  state.month=state.monthKeys.includes(nowM)?nowM:state.monthKeys[0];
}

async function loadAll(){
  const [r,b]=await Promise.all([
    db.collection(CONFIG.col.reservations).get(),
    db.collection(CONFIG.col.blocks).get()
  ]);
  state.res={};
  r.forEach(d=>{ const v=d.data(); if(v.status!=='cancelled') state.res[d.id]={id:d.id,...v}; });
  state.blocks={};
  (CONFIG.closed||[]).forEach(k=>{ state.blocks[k]='closed'; });
  b.forEach(d=>{ const v=d.data(); state.blocks[v.time?slotId(v.date,v.time):v.date]=v.kind||'closed'; });
  render();
  const t=new Date();
  $('#stamp').textContent=`${pad(t.getHours())}:${pad(t.getMinutes())} 기준`;
}

const resAt=(d,t)=>Object.values(state.res).find(x=>x.date===d&&x.time===t)||null;
const isBlocked=(d,t)=>(d in state.blocks)||(slotId(d,t) in state.blocks);

function render(){
  const total=state.dates.length*CONFIG.times.length;
  const rows=Object.values(state.res);
  const confirmed=rows.filter(r=>r.status==='confirmed').length;
  let blocked=0, open=0;
  state.dates.forEach(d=>CONFIG.times.forEach(t=>{ if(isBlocked(d,t)) blocked++; else if(!resAt(d,t)) open++; }));
  $('#stats').innerHTML=`
    <div class="stat"><dt>공연일</dt><dd>${state.dates.length}<small>일</small></dd></div>
    <div class="stat"><dt>전체 회차</dt><dd>${total}<small>회</small></dd></div>
    <div class="stat"><dt>예약</dt><dd>${rows.length}<small>건</small></dd></div>
    <div class="stat"><dt>확정</dt><dd>${confirmed}<small>건</small></dd></div>
    <div class="stat"><dt>열려 있음</dt><dd>${open}<small>회</small></dd></div>
    <div class="stat"><dt>막아둠</dt><dd>${blocked}<small>회</small></dd></div>`;

  const names=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  $('#months').innerHTML='';
  state.monthKeys.forEach(mk=>{
    const b=document.createElement('button');
    b.className='month-tab'+(mk===state.month?' on':'');
    b.innerHTML=`${names[Number(mk.slice(5))-1]} <span style="font-family:var(--sans);font-size:11.5px;letter-spacing:0">${Number(mk.slice(5))}월</span>`;
    b.onclick=()=>{ state.month=mk; render(); };
    $('#months').appendChild(b);
  });

  const box=$('#days'); box.innerHTML='';
  const tk=keyOf(new Date());
  state.dates.filter(k=>k.slice(0,7)===state.month).forEach(d=>{
    const cnt=CONFIG.times.filter(t=>resAt(d,t)).length;
    const allBlocked=CONFIG.times.every(t=>isBlocked(d,t));
    const card=document.createElement('article');
    card.className='daycard'+(allBlocked?' off':'');
    card.innerHTML=`
      <div class="dayhead">
        <h3>${parseKey(d).getMonth()+1}월 ${parseKey(d).getDate()}일<em>${dowKr(d)}요일</em></h3>
        ${d===tk?'<span class="today">TODAY</span>':''}
        <span class="cnt">${cnt} / ${CONFIG.times.length}</span>
      </div>
      <div class="cells">${CONFIG.times.map(t=>{
        const r=resAt(d,t);
        if(r){
          const ok=r.status==='confirmed';
          return `<div class="cell taken"><div class="time">${t}</div>
            <div class="who"><b>${esc(r.nickname)}</b></div>
            <div class="code">${esc(r.code||r.id)}</div>
            <span class="pill ${ok?'ok':'wait'}">${ok?'확정':'대기'}</span></div>`;
        }
        if(isBlocked(d,t)){
          const hold=state.blocks[d]!=='closed'&&(state.blocks[slotId(d,t)]==='hold'||state.blocks[d]==='hold');
          return `<div class="cell blocked"><div class="time">${t}</div>
            <div class="note">${hold?'오픈 대기 잠금':'휴관'}</div></div>`;
        }
        return `<div class="cell"><div class="time">${t}</div><div class="note">비어 있음</div></div>`;
      }).join('')}</div>`;
    box.appendChild(card);
  });
  if(!box.children.length) box.innerHTML='<p class="empty-state">이 달에는 공연일이 없습니다.</p>';
}

/* ══════ 로그인 ══════ */
async function unlock(){
  const msg=$('#pwMsg'); msg.className='msg';
  const email=$('#email').value.trim(), pw=$('#pw').value;
  if(!email||!pw){ msg.classList.add('err'); msg.textContent='이메일과 비밀번호를 모두 입력해 주세요.'; return; }
  $('#pwBtn').disabled=true;
  msg.innerHTML='<span class="spin"></span>확인하는 중';
  try{ await auth.signInWithEmailAndPassword(email,pw); }
  catch(e){
    console.error(e);
    msg.className='msg err';
    msg.textContent=['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)
      ? '이메일 또는 비밀번호가 맞지 않습니다.'
      : e.code==='auth/too-many-requests' ? '시도가 너무 잦습니다. 잠시 후 다시 해주세요.'
      : '로그인하지 못했습니다.';
  }finally{ $('#pwBtn').disabled=false; }
}
$('#pwBtn').onclick=unlock;
[$('#email'),$('#pw')].forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); }));
$('#outBtn').onclick=async()=>{ try{ await auth.signOut(); }catch(e){} location.reload(); };
$('#reloadBtn').onclick=async()=>{ try{ await loadAll(); }catch(e){ console.error(e); } };

if(auth) auth.onAuthStateChanged(async u=>{
  if(u){
    $('#gate').hidden=true; $('#app').hidden=false;
    $('#pwMsg').textContent=''; $('#pw').value='';
    buildDates();
    try{ await loadAll(); }
    catch(e){
      console.error(e);
      $('#days').innerHTML='<p class="empty-state">예약 목록을 불러오지 못했습니다.<br>이 계정에 조회 권한이 있는지 확인해 주세요.</p>';
    }
  } else { $('#app').hidden=true; $('#gate').hidden=false; }
});

if(!netOk){
  const bar=document.getElementById('netBar');
  if(bar) bar.hidden=false;
  const b=$('#pwBtn'); if(b) b.disabled=true;
}
window.addEventListener('error',e=>{
  if(e.message && /firebase|is not defined/i.test(e.message)){
    const bar=document.getElementById('netBar'); if(bar) bar.hidden=false;
  }
});
</script>
</body>
</html>
